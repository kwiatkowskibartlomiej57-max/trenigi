<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e7ebe3">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Zakładka: dziennik czytania z książką bazową, kilkoma książkami naraz, celem rocznym i cytatami. Działa bez internetu.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zakładka">
  <title>Zakładka</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..500&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      var m = localStorage.getItem('zakladka-motyw');
      if (m === 'jasny') document.documentElement.dataset.theme = 'light';
      else if (m === 'ciemny') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <a class="pomin" href="#widok">Przejdź do treści</a>
  <header class="gora">
    <div class="gora-wew">
      <button type="button" class="marka" data-akcja="idz" data-widok="dzis" aria-label="Zakładka, ekran Dziś">
        <svg class="logo" viewBox="100 120 312 340" aria-hidden="true"><path d="M118 380c56-7 104 0 138 24 34-24 82-31 138-24v16c-56-7-104 0-138 24-34-24-82-31-138-24z" fill="var(--zloto)"/><path d="M256 170c-34-23-82-31-138-25v235c56-7 104 0 138 24z" fill="var(--strona-l)"/><path d="M256 170c34-23 82-31 138-25v235c-56-7-104 0-138 24z" fill="var(--strona-p)"/><path d="M318 132h34v318l-17-21-17 21z" fill="var(--wstazka)"/></svg>
        <span>Zakładka</span>
      </button>
      <button type="button" class="btn-dodaj" data-akcja="dodaj" aria-label="Dodaj książkę">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <main id="widok" class="widok" tabindex="-1"></main>

  <button type="button" id="pigulka" class="pigulka" data-akcja="sesja" hidden></button>

  <nav class="dol" aria-label="Główna nawigacja"><div class="dol-wew" id="nawigacja"></div></nav>

  <div id="toasty" class="toasty"></div>

  <noscript><p style="padding:24px">Zakładka potrzebuje włączonego JavaScriptu.</p></noscript>

  <script src="js/db.js"></script>
  <script src="js/core.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
