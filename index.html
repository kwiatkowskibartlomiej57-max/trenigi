<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Training</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2a2f3a;--txt:#eef0f4;--mut:#8b93a3;--acc:#4cc38a;--accd:#12392a;--warn:#f5a623;--bad:#ef5b5b;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:26px;margin:6px 0 2px}
h2{font-size:19px;margin:18px 0 8px}
h3{font-size:17px;margin:0}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
button,.btn{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px}
button:active{filter:brightness(1.25)}
button.pri{background:var(--acc);color:#06210f;border:0;font-weight:700}
button.danger{color:var(--bad)}
button.sm{min-height:38px;padding:8px 12px;font-size:14px}
button.ghost{background:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sess{padding:16px 12px;text-align:left;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.sess b{display:block;font-size:18px}
.sess span{color:var(--mut);font-size:13px}
.sess.today{border-color:var(--acc);background:var(--accd)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:40px}
.seg button.on{background:var(--acc);color:#06210f;font-weight:700}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut);margin:6px 6px 0 0}
.pill.fail{color:var(--warn);border-color:#5b4515}
.pill.rir{color:#7cc4ff;border-color:#1d4466}
.last{color:var(--mut);font-size:13px;margin:8px 0 0}
.inputs{display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.inputs label{flex:1;min-width:62px;font-size:12px;color:var(--mut);display:block}
input,select{font:inherit;font-size:17px;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 6px;width:100%;text-align:center;min-height:46px}
input[type=date]{text-align:left;padding:10px}
input:focus{outline:2px solid var(--acc);outline-offset:0}
textarea{font:inherit;font-size:16px;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:70px}
.hint{margin-top:10px;font-weight:700;font-size:14px;min-height:0}
.hint.up{color:var(--acc)}
.hint.rep{color:var(--warn)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tip{margin-top:10px;padding:10px;background:var(--card2);border-radius:10px;font-size:14px}
.tip a{color:#7cc4ff;display:block;padding:6px 0}
.hidden{display:none}
.banner{background:#3a2d0c;border:1px solid #6b5316;color:#ffd98a;border-radius:12px;padding:12px;margin:0 0 12px;font-size:14px}
.bar{height:12px;border-radius:99px;background:var(--card2);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:#4aa8ff;border-radius:99px;transition:width .2s}
.big{font-size:34px;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(24,27,34,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{flex:1;border:0;background:transparent;font-size:12px;color:var(--mut);min-height:52px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:21px;line-height:1}
.tabs button.on{color:var(--acc)}
.timer{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 70px);background:var(--accd);border:1px solid var(--acc);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.timer b{font-size:24px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 150px);background:#000;border:1px solid var(--line);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;z-index:9;max-width:90%}
.hrow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.small{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<div id="timerbox"></div>
<nav class="tabs" id="tabs"></nav>

<script>
'use strict';
/* ====== PLAN (edytuj tutaj, jeśli zmienisz ćwiczenia) ====== */
const YT = q => 'https://www.youtube.com/results?search_query=' + q;
const E = (id, n, h, s, lo, hi, o = {}) => ({id, n, h, s, r: [lo, hi], unit: o.unit || 'powt.', mode: o.mode || '', noW: !!o.noW, rest: o.rest || 90, tip: o.tip || '', yt: o.yt || []});
const PLAN = {
  gA: {name: 'Góra A', day: 1, dayName: 'poniedziałek', ex: [
    E('gA1', 'Chest press (maszyna)', 'Wyciskanie sztangi płaskie', 3, 6, 10, {mode: 'fail', rest: 180, tip: 'Łopatki ściągnięte, stopy na podłodze. Dwie serie RIR 1-2, ostatnia do upadku (maszyna jest podparta).', yt: ['chest+press+maszyna+technika']}),
    E('gA2', 'Lat pulldown, chwyt szeroki', 'Ściąganie gumy z góry, chwyt szeroki', 3, 8, 12, {mode: 'fail', rest: 180, tip: 'Ściągasz drążek do górnej części klatki, łokcie w dół, bez bujania tułowiem. Dwie serie RIR 1-2, ostatnia do upadku.', yt: ['sciaganie+drazka+wyciagu+gornego+technika']}),
    E('gA3', 'Shoulder press (maszyna, plecy przy oparciu)', 'Wyciskanie hantli nad głowę siedząc (z oparciem)', 2, 8, 12, {mode: 'rir', rest: 150, tip: 'Plecy zawsze przy oparciu, bez wyginania w łuk. Zapas 1-2 powtórzeń.', yt: ['shoulder+press+maszyna+technika']}),
    E('gA4', 'Chest-supported row (maszyna z oparciem klatki)', 'Wiosłowanie hantlem jednorącz', 2, 8, 12, {mode: 'rir', rest: 150, tip: 'Klatka na oparciu = zero obciążenia lędźwi. Technika ważniejsza niż upadek: zapas 1-2 powtórzeń.', yt: ['wioslowanie+na+maszynie+z+oparciem+klatki']}),
    E('gA5', 'Modlitewnik / uginanie ramion na wyciągu dolnym', 'Uginanie hantli na biceps', 3, 10, 12, {tip: 'Łokcie przy tułowiu, powoli w dół.', yt: ['uginanie+ramion+wyciag+dolny+technika']}),
    E('gA6', 'Prostowanie ramion nad głową z liną (wyciąg)', 'Francuskie wyciskanie', 3, 10, 12, {tip: 'Najbezpieczniej siedząc na ławce z oparciem pleców. Nie wyginaj lędźwi: żebra w dół, brzuch napięty. Jeśli plecy się wyginają albo czujesz mrowienie, zamień na triceps z wyciągu z góry (drążek / lina).', yt: ['prostowanie+ramion+nad+glowa+lina+wyciag+technika', 'triceps+wyciag+prosty+drazek+technika']}),
    E('robak', 'Martwy robak (na stronę)', 'Martwy robak (na stronę)', 2, 10, 12, {noW: true, rest: 60, tip: 'Lędźwie przy podłodze, ruch powoli. Jeśli plecy odrywają się od podłoża, skróć ruch.', yt: ['dead+bug+technika']}),
    E('pallof', 'Pallof press na wyciągu (na stronę)', 'Pallof press z gumą', 3, 10, 12, {rest: 60, tip: 'Antyrotacja: tułów się nie skręca. Ciężar dokładasz talerzem.', yt: ['pallof+press+wyciag+technika']}),
    E('gA9', 'Reverse crunch na ławce', 'Reverse crunch na podłodze', 3, 10, 15, {noW: true, rest: 60, tip: 'Mały ruch, miednica PODWINIĘTA, bez rzucania nóg. Zacznij bardzo lekko i najpierw pokaż fizjoterapeucie. Mrowienie lub promieniowanie w nogę = odpuść.', yt: ['reverse+crunch+technika']})
  ]},
  dA: {name: 'Dół A', day: 2, dayName: 'wtorek', ex: [
    E('dA1', 'Leg press', 'Goblet squat', 3, 8, 12, {mode: 'rir', rest: 180, tip: 'Miednica NIE odrywa się od oparcia, nie schodź głębiej niż przed podwinięciem miednicy. Zapas 1-2 powtórzeń.', yt: ['leg+press+technika']}),
    E('dA2', 'Hip thrust (maszyna / smith)', 'Hip thrust z hantlem', 3, 8, 12, {mode: 'rir', rest: 150, tip: 'Pauza 2 s na górze, miednica PODWINIĘTA, broda do klatki.', yt: ['hip+thrust+maszyna+technika']}),
    E('dA3', 'Leg extension (maszyna)', 'Wykroki z hantlami (na nogę)', 3, 10, 15, {mode: 'fail', rest: 90, tip: 'Maszyna z podparciem: ostatnia seria może być do upadku.', yt: ['leg+extension+maszyna+technika']}),
    E('legcurl', 'Uginanie nóg na maszynie siedząc', 'Unoszenie bioder jednonóż', 3, 10, 15, {tip: 'Siedząc, nie leżąc: leżąc łatwo wyginasz lędźwie.', yt: ['uginanie+nog+siedzac+maszyna+technika']}),
    E('sideplank', 'Side plank (sekundy na stronę)', 'Side plank', 3, 20, 30, {unit: 's', noW: true, rest: 60, tip: 'Ciało w jednej linii od głowy do stóp, biodro nie opada. Progres: z kolan na proste nogi.', yt: ['side+plank+technika']})
  ]},
  gB: {name: 'Góra B', day: 4, dayName: 'czwartek', ex: [
    E('gB1', 'Incline chest press (maszyna, górna klatka)', 'Wyciskanie hantli na skosie', 3, 8, 12, {mode: 'fail', rest: 180, tip: 'Dwie serie RIR 1-2, ostatnia do upadku (maszyna jest podparta).', yt: ['incline+chest+press+maszyna+technika']}),
    E('gB2', 'Wiosłowanie na maszynie z oparciem klatki / T-bar z podparciem', 'Wiosłowanie w podporze na skosie', 3, 8, 12, {mode: 'rir', rest: 150, tip: 'Zero obciążenia lędźwi dzięki podparciu klatki. Zapas 1-2 powtórzeń.', yt: ['wioslowanie+na+maszynie+z+oparciem+klatki', 't-bar+row+chest+supported+technika']}),
    E('gB3', 'Lat pulldown, chwyt neutralny (V-bar) / podchwyt', 'Ściąganie gumy z góry, chwyt neutralny', 2, 8, 12, {mode: 'fail', rest: 150, tip: 'Inny kąt niż w Górze A. Ostatnia seria do upadku.', yt: ['lat+pulldown+v-bar+chwyt+neutralny+technika']}),
    E('gB4', 'Unoszenie bokiem (maszyna / wyciąg dolny jednorącz)', 'Unoszenie hantli bokiem', 3, 12, 15, {yt: ['unoszenie+ramion+bokiem+maszyna+technika', 'unoszenie+bokiem+wyciag+dolny+jednoracz']}),
    E('gB5', 'Face pull na wyciągu (lina)', 'Face pull z gumą', 2, 12, 15, {yt: ['face+pull+wyciag+lina+technika']}),
    E('gB6', 'Rozpiętki na butterfly (pec deck)', 'Rozpiętki z hantlami', 2, 12, 15, {yt: ['butterfly+pec+deck+technika']}),
    E('gB7', 'Uginanie młotkowe z liną na wyciągu dolnym', 'Uginanie młotkowe z hantlami', 2, 10, 12, {yt: ['uginanie+mlotkowe+lina+wyciag+dolny+technika']}),
    E('gB8', 'Dipy na maszynie z odciążeniem / triceps na wyciągu', 'Dipy / pompki wąskie', 2, 10, 12, {yt: ['maszyna+do+dipow+technika']}),
    E('robak', 'Martwy robak (na stronę)', 'Martwy robak (na stronę)', 2, 10, 12, {noW: true, rest: 60, tip: 'Lędźwie przy podłodze, ruch powoli. Jeśli plecy odrywają się od podłoża, skróć ruch.', yt: ['dead+bug+technika']}),
    E('pallof', 'Pallof press na wyciągu (na stronę)', 'Pallof press z gumą', 3, 10, 12, {rest: 60, tip: 'Antyrotacja: tułów się nie skręca. Ciężar dokładasz talerzem.', yt: ['pallof+press+wyciag+technika']}),
    E('sideplank', 'Side plank (sekundy na stronę)', 'Side plank', 2, 20, 30, {unit: 's', noW: true, rest: 60, tip: 'Ciało w jednej linii od głowy do stóp, biodro nie opada.', yt: ['side+plank+technika']})
  ]},
  dB: {name: 'Dół B', day: 5, dayName: 'piątek', ex: [
    E('dB1', 'Hip thrust (maszyna / smith), lżej', 'Hip thrust z hantlem (lżej)', 2, 12, 15, {mode: 'rir', rest: 120, tip: 'Lżej i więcej powtórzeń niż w Dole A. Miednica PODWINIĘTA.', yt: ['hip+thrust+maszyna+technika']}),
    E('legcurl', 'Uginanie nóg na maszynie siedząc', 'Unoszenie bioder jednonóż', 3, 12, 15, {tip: 'Siedząc, nie leżąc: leżąc łatwo wyginasz lędźwie.', yt: ['uginanie+nog+siedzac+maszyna+technika']}),
    E('dB3', 'Leg press lekki', 'Goblet squat lekki', 2, 12, 15, {mode: 'rir', rest: 120, tip: 'Miednica NIE odrywa się od oparcia. Zapas 1-2 powtórzeń.', yt: ['leg+press+technika']}),
    E('dB4', 'Hip abduction (maszyna)', 'Odwodzenie bioder z gumą', 3, 15, 20, {yt: ['hip+abduction+maszyna+technika']}),
    E('dB5', 'Łydki na maszynie siedząc', 'Wspięcia na palce na stopniu, z hantlem', 3, 12, 20, {tip: 'Pełny zakres, pauza na dole.', yt: ['lydki+siedzac+maszyna+technika']}),
    E('deadbug', 'Dead bug (martwy robak)', 'Dead bug', 3, 10, 12, {noW: true, rest: 60, tip: 'Lędźwie przy podłodze, ruch powoli.', yt: ['dead+bug+technika']})
  ]}
};
const ORDER = ['gA', 'dA', 'gB', 'dB'];

/* ====== STAN I ZAPIS (lokalnie w telefonie) ====== */
const STORE_KEY = 'training.v1', DRAFT_KEY = 'training.draft.v1', MODE_KEY = 'training.mode';
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
let db = Object.assign({workouts: [], water: {}, weights: {}, waterGoal: 2500, lastBackup: null, sinceBackup: 0}, load(STORE_KEY, {}));
let draft = load(DRAFT_KEY, null);
let tab = 'train';
let mode = localStorage.getItem(MODE_KEY) || 'gym';
let persisted = null;
let timer = null; // {end, total}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtDate = s => { const [y, m, d] = s.split('-'); return d + '.' + m + '.' + y; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function saveDb() { try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); return true; } catch (e) { toast('Błąd zapisu! Zrób kopię (zakładka Kopia).'); return false; } }
function syncDraftToDb() {
  if (!draft) return;
  const i = db.workouts.findIndex(w => w.id === draft.id), any = draft.ex.some(hasData);
  if (any) { const c = JSON.parse(JSON.stringify(draft)); if (i >= 0) db.workouts[i] = c; else db.workouts.push(c); saveDb(); }
  else if (i >= 0 && !draft.done) { db.workouts.splice(i, 1); saveDb(); }
}
function saveDraft() { try { if (draft) localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); else localStorage.removeItem(DRAFT_KEY); } catch (e) {} syncDraftToDb(); }
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }

/* ====== LOGIKA ====== */
const findEx = (sess, id) => PLAN[sess].ex.find(e => e.id === id);
const hasData = x => x && (x.w !== '' || x.reps.some(r => r !== ''));
function sortedWorkouts() { return db.workouts.slice().sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id)); }
function lastFor(exId) {
  for (const w of sortedWorkouts()) { if (draft && w.id === draft.id) continue; const x = w.ex.find(e => e.id === exId && hasData(e)); if (x) return {date: w.date, w: x.w, reps: x.reps}; }
  return null;
}
function hintFor(e, x) {
  if (!x.reps.every(r => r !== '' && !isNaN(+r))) return null;
  const ok = x.reps.filter(r => +r >= e.r[1]).length >= e.s;
  if (e.noW) return ok ? {c: 'up', t: 'GOTOWE: zwiększ zakres albo trudniejsza wersja'} : {c: 'rep', t: 'POWTÓRZ: dobij do ' + e.r[1] + ' ' + e.unit + ' we wszystkich seriach'};
  return ok ? {c: 'up', t: 'DODAJ CIĘŻAR: następnym razem +1 płytka i wróć do ' + e.r[0] + ' powt.'} : {c: 'rep', t: 'POWTÓRZ CIĘŻAR: dobij do ' + e.r[1] + ' ' + e.unit + ' we wszystkich seriach'};
}
function lastDone(sess) { const w = sortedWorkouts().find(w => w.session === sess); return w ? w.date : null; }
function suggested() { const d = new Date().getDay(); return ORDER.find(k => PLAN[k].day === d) || null; }
function startWorkout(sess) {
  draft = {id: uid(), date: todayStr(), session: sess, mode, ex: PLAN[sess].ex.map(e => ({id: e.id, w: '', reps: Array(e.s).fill(''), note: ''})), note: ''};
  saveDraft(); render();
}
function finishWorkout() {
  if (!draft) return;
  if (!draft.ex.some(hasData)) { toast('Nic nie wpisano'); return; }
  if (!draft.done) { db.sinceBackup = (db.sinceBackup || 0) + 1; }
  draft.done = true;
  syncDraftToDb();
  if (saveDb()) { draft = null; saveDraft(); stopTimer(); toast('Trening zakończony'); tab = 'hist'; render(); }
}
function dropDraft() {
  if (draft.done) { draft = null; saveDraft(); stopTimer(); render(); return; }
  if (confirm('Usunąć ten trening wraz z wpisanymi seriami?')) { db.workouts = db.workouts.filter(w => w.id !== draft.id); saveDb(); draft = null; saveDraft(); stopTimer(); render(); }
}

/* ====== TIMER PRZERWY ====== */
let timerInt = null;
function startTimer(sec) {
  timer = {end: Date.now() + sec * 1000};
  clearInterval(timerInt); timerInt = setInterval(tickTimer, 250); tickTimer();
}
function stopTimer() { timer = null; clearInterval(timerInt); timerInt = null; $('#timerbox').innerHTML = ''; }
function beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .2; o.start(); setTimeout(() => { o.stop(); c.close(); }, 450); } catch (e) {} if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
function tickTimer() {
  if (!timer) return;
  const left = Math.max(0, Math.round((timer.end - Date.now()) / 1000));
  if (left === 0) { beep(); toast('Koniec przerwy'); stopTimer(); return; }
  $('#timerbox').innerHTML = '<div class="timer"><b>' + Math.floor(left / 60) + ':' + pad(left % 60) + '</b><span class="small grow">przerwa</span><button class="sm" data-act="tadd">+30 s</button><button class="sm" data-act="tstop">Stop</button></div>';
}

/* ====== KOPIE ZAPASOWE ====== */
function dl(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
async function shareOrDownload(blob, name, type) {
  const file = new File([blob], name, {type});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], title: name}); return true; } catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  dl(blob, name); return true;
}
async function exportJson() {
  const data = {app: 'training', version: 1, exported: new Date().toISOString(), db};
  const ok = await shareOrDownload(new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'}), 'training-kopia-' + todayStr() + '.json', 'application/json');
  if (ok) { db.lastBackup = new Date().toISOString(); db.sinceBackup = 0; saveDb(); toast('Kopia zapisana. Wybierz Pliki / iCloud Drive.'); render(); }
}
async function exportCsv() {
  const rows = [['data', 'sesja', 'cwiczenie', 'ciezar_kg', 'S1', 'S2', 'S3', 'S4', 'uwagi']];
  for (const w of db.workouts.slice().sort((a, b) => a.date.localeCompare(b.date))) for (const x of w.ex) {
    if (!hasData(x)) continue;
    const e = findEx(w.session, x.id) || {n: x.id};
    rows.push([w.date, PLAN[w.session] ? PLAN[w.session].name : w.session, e.n, String(x.w).replace('.', ','), ...[0, 1, 2, 3].map(i => x.reps[i] == null ? '' : x.reps[i]), x.note || '']);
  }
  const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  await shareOrDownload(new Blob([csv], {type: 'text/csv'}), 'training-historia-' + todayStr() + '.csv', 'text/csv');
}
function importJson(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result);
      if (!data || !data.db || !Array.isArray(data.db.workouts)) throw new Error('zły plik');
      if (!confirm('Scalić kopię z obecnymi danymi? (Treningi o tym samym ID zostaną zastąpione, nic nie zostanie usunięte.)')) return;
      const ids = new Set(data.db.workouts.map(w => w.id));
      db.workouts = db.workouts.filter(w => !ids.has(w.id)).concat(data.db.workouts);
      db.water = Object.assign({}, data.db.water || {}, db.water);
      db.weights = Object.assign({}, data.db.weights || {}, db.weights);
      saveDb(); toast('Wczytano ' + data.db.workouts.length + ' treningów'); render();
    } catch (e) { toast('Nie udało się wczytać pliku'); }
  };
  fr.readAsText(file);
}
function backupNeeded() {
  if (!db.workouts.length) return false;
  if (!db.lastBackup) return true;
  const days = (Date.now() - new Date(db.lastBackup)) / 864e5;
  return (db.sinceBackup || 0) >= 4 || days >= 14;
}

/* ====== WIDOKI ====== */
function viewTrain() {
  if (draft) return viewDraft();
  const sug = suggested();
  let h = '<h1>Trening</h1><p class="sub">' + new Date().toLocaleDateString('pl-PL', {weekday: 'long', day: 'numeric', month: 'long'}) + '</p>';
  if (backupNeeded()) h += '<div class="banner">Zrób kopię zapasową danych (zakładka Kopia), żeby ich nie stracić.</div>';
  h += '<div class="seg"><button data-act="mode" data-v="gym" class="' + (mode === 'gym' ? 'on' : '') + '">Siłownia</button><button data-act="mode" data-v="home" class="' + (mode === 'home' ? 'on' : '') + '">Dom</button></div>';
  h += sug ? '<p class="sub">Dziś w planie: <b>' + PLAN[sug].name + '</b>. Możesz wybrać inną sesję.</p>' : '<p class="sub">Dziś dzień wolny w planie. Możesz wybrać dowolną sesję.</p>';
  h += '<div class="grid">' + ORDER.map(k => { const l = lastDone(k); return '<button class="sess ' + (k === sug ? 'today' : '') + '" data-act="start" data-v="' + k + '"><b>' + PLAN[k].name + '</b><span>' + PLAN[k].dayName + '<br>' + (l ? 'ostatnio ' + fmtDate(l) : 'jeszcze nie robiony') + '</span></button>'; }).join('') + '</div>';
  return h;
}
function viewDraft() {
  const P = PLAN[draft.session];
  let h = '<div class="hrow"><span class="small" id="saved">✓ Zapisuje się automatycznie po każdym wpisie</span><button class="sm ghost' + (draft.done ? '' : ' danger') + '" data-act="drop">' + (draft.done ? 'Zamknij' : 'Usuń trening') + '</button></div>';
  h += '<h1>' + P.name + '</h1>';
  h += '<div class="row" style="margin-bottom:12px"><div class="grow"><input type="date" id="dDate" value="' + draft.date + '"></div><div class="seg" style="margin:0;min-width:150px"><button data-act="dmode" data-v="gym" class="' + (draft.mode === 'gym' ? 'on' : '') + '">Siłownia</button><button data-act="dmode" data-v="home" class="' + (draft.mode === 'home' ? 'on' : '') + '">Dom</button></div></div>';
  P.ex.forEach((e, i) => {
    const x = draft.ex[i], last = lastFor(e.id), name = draft.mode === 'home' ? e.h : e.n;
    h += '<div class="card" id="c-' + i + '"><h3>' + (i + 1) + '. ' + esc(name) + '</h3>';
    h += '<span class="pill">' + e.s + ' × ' + e.r[0] + '-' + e.r[1] + ' ' + e.unit + '</span>';
    if (e.mode === 'fail') h += '<span class="pill fail">ostatnia seria do upadku</span>';
    if (e.mode === 'rir') h += '<span class="pill rir">zapas 1-2 powt.</span>';
    h += '<div class="last">' + (last ? 'Ostatnio (' + fmtDate(last.date) + '): ' + (last.w !== '' && !e.noW ? esc(last.w) + ' kg, ' : '') + last.reps.filter(r => r !== '').map(esc).join(', ') : 'Brak historii: ustal ciężar startowy') + '</div>';
    h += '<div class="inputs">';
    if (!e.noW) h += '<label>kg<input inputmode="decimal" data-i="' + i + '" data-k="w" value="' + esc(x.w) + '" placeholder="' + (last && last.w !== '' ? esc(last.w) : '') + '"></label>';
    for (let s = 0; s < e.s; s++) h += '<label>S' + (s + 1) + '<input inputmode="numeric" data-i="' + i + '" data-k="r" data-s="' + s + '" value="' + esc(x.reps[s]) + '" placeholder="' + (last && last.reps[s] != null && last.reps[s] !== '' ? esc(last.reps[s]) : '') + '"></label>';
    h += '</div><div class="hint" id="hint-' + i + '"></div>';
    h += '<div class="actions"><button class="sm" data-act="tip" data-i="' + i + '">Jak wykonać</button><button class="sm" data-act="timer" data-v="' + e.rest + '">Przerwa ' + Math.floor(e.rest / 60) + ':' + pad(e.rest % 60) + '</button></div>';
    h += '<div class="tip hidden" id="tip-' + i + '">' + (e.tip ? esc(e.tip) + '<br>' : '') + e.yt.map(q => '<a href="' + YT(q) + '" target="_blank" rel="noopener">▶ Film z techniką</a>').join('') + '<div class="small" style="margin-top:6px">Zamiennik: ' + esc(draft.mode === 'home' ? e.n : e.h) + '</div></div>';
    h += '<div style="margin-top:10px"><input data-i="' + i + '" data-k="note" value="' + esc(x.note) + '" placeholder="Notatka (opcjonalnie)" style="text-align:left;padding:10px"></div></div>';
  });
  h += '<div class="card"><textarea id="dNote" placeholder="Notatka do całego treningu (sen, samopoczucie, plecy)">' + esc(draft.note) + '</textarea></div>';
  h += '<button class="pri" style="width:100%;min-height:54px;font-size:18px" data-act="finish">Zakończ trening</button>';
  return h;
}
function viewHist() {
  const ws = sortedWorkouts();
  let h = '<h1>Historia</h1><p class="sub">' + ws.length + ' zapisanych treningów</p>';
  if (!ws.length) return h + '<div class="card small">Tu pojawią się zapisane treningi.</div>';
  ws.forEach(w => {
    const P = PLAN[w.session];
    h += '<div class="card"><div class="hrow" data-act="open" data-v="' + w.id + '"><div><b>' + fmtDate(w.date) + '</b> · ' + (P ? P.name : esc(w.session)) + ' <span class="small">(' + (w.mode === 'home' ? 'dom' : 'siłownia') + ')</span>' + (draft && draft.id === w.id ? ' <span class="pill fail">w toku</span>' : '') + '</div><span class="small">' + w.ex.filter(hasData).length + ' ćw. ›</span></div>';
    h += '<div class="hidden" id="h-' + w.id + '"><table style="margin-top:8px">';
    w.ex.filter(hasData).forEach(x => { const e = P && findEx(w.session, x.id); h += '<tr><td>' + esc(e ? (w.mode === 'home' ? e.h : e.n) : x.id) + '</td><td>' + (x.w !== '' ? esc(x.w) + ' kg · ' : '') + x.reps.filter(r => r !== '').map(esc).join(', ') + '</td></tr>' + (x.note ? '<tr><td colspan="2" class="small">' + esc(x.note) + '</td></tr>' : ''); });
    h += '</table>' + (w.note ? '<p class="small">' + esc(w.note) + '</p>' : '') + '<div class="row" style="margin-top:10px"><button class="sm" data-act="edit" data-v="' + w.id + '">Edytuj</button><button class="sm danger" data-act="del" data-v="' + w.id + '">Usuń</button></div></div></div>';
  });
  return h;
}
function viewBody() {
  const t = todayStr(), ml = db.water[t] || 0, goal = db.waterGoal || 2500, pct = Math.min(100, Math.round(ml / goal * 100));
  let h = '<h1>Woda i waga</h1><p class="sub">' + fmtDate(t) + '</p>';
  h += '<div class="card"><h3>Woda dzisiaj</h3><div class="big">' + (ml / 1000).toFixed(2).replace('.', ',') + ' l <span class="small">/ ' + (goal / 1000).toFixed(1).replace('.', ',') + ' l</span></div><div class="bar"><i style="width:' + pct + '%"></i></div>';
  h += '<div class="row wrap"><button data-act="water" data-v="250">+250 ml</button><button data-act="water" data-v="500">+500 ml</button><button data-act="water" data-v="-250" class="ghost">−250</button></div>';
  h += '<div class="row" style="margin-top:10px"><label class="small grow">Cel dzienny (ml)<input inputmode="numeric" id="goal" value="' + goal + '"></label></div>';
  const days = Object.keys(db.water).sort().reverse().slice(0, 7);
  if (days.length) h += '<table style="margin-top:10px">' + days.map(d => '<tr><td>' + fmtDate(d) + '</td><td>' + (db.water[d] / 1000).toFixed(2).replace('.', ',') + ' l</td></tr>').join('') + '</table>';
  h += '</div>';
  const wd = Object.keys(db.weights).sort().reverse();
  h += '<div class="card"><h3>Waga ciała</h3><div class="row" style="margin-top:8px"><input inputmode="decimal" id="bw" placeholder="kg" value="' + (db.weights[t] != null ? esc(db.weights[t]) : '') + '"><button class="pri" data-act="bw">Zapisz</button></div>';
  if (wd.length) h += '<table style="margin-top:10px">' + wd.slice(0, 10).map(d => '<tr><td>' + fmtDate(d) + '</td><td>' + esc(db.weights[d]) + ' kg</td></tr>').join('') + '</table>';
  h += '</div>';
  return h;
}
function viewBackup() {
  const lb = db.lastBackup ? new Date(db.lastBackup).toLocaleDateString('pl-PL') : 'jeszcze nigdy';
  let h = '<h1>Kopia danych</h1><p class="sub">Dane są zapisane lokalnie w telefonie. Kopia chroni cię przed utratą (np. po wyczyszczeniu danych Safari albo zmianie telefonu).</p>';
  h += '<div class="card"><h3>Kopia zapasowa</h3><p class="small">Ostatnia kopia: ' + lb + '. Od tamtej pory zapisanych treningów: ' + (db.sinceBackup || 0) + '.</p><button class="pri" style="width:100%" data-act="exj">Zapisz kopię (do Plików / iCloud)</button><p class="small">Po stuknięciu wybierz „Zapisz w Plikach” i folder w iCloud Drive.</p></div>';
  h += '<div class="card"><h3>Wczytaj kopię</h3><input type="file" id="imp" accept="application/json,.json" style="text-align:left"></div>';
  h += '<div class="card"><h3>Eksport do Excela</h3><p class="small">Plik CSV z całą historią (ciężar i powtórzenia).</p><button style="width:100%" data-act="exc">Eksportuj CSV</button></div>';
  h += '<div class="card"><h3>Trwałość zapisu</h3><p class="small">' + (persisted === true ? 'Przeglądarka oznaczyła dane jako trwałe.' : persisted === false ? 'Przeglądarka nie potwierdziła trwałego zapisu. Dodaj aplikację do ekranu początkowego i rób kopie.' : 'Sprawdzanie…') + '</p></div>';
  return h;
}

/* ====== RENDER I ZDARZENIA ====== */
const TABS = [['train', '🏋️', 'Trening'], ['hist', '📋', 'Historia'], ['body', '💧', 'Woda'], ['bak', '💾', 'Kopia']];
function render() {
  $('#tabs').innerHTML = TABS.map(t => '<button class="' + (tab === t[0] ? 'on' : '') + '" data-act="tab" data-v="' + t[0] + '"><span>' + t[1] + '</span>' + t[2] + '</button>').join('');
  $('#app').innerHTML = tab === 'train' ? viewTrain() : tab === 'hist' ? viewHist() : tab === 'body' ? viewBody() : viewBackup();
  if (tab === 'train' && draft) PLAN[draft.session].ex.forEach((e, i) => updHint(i));
  const imp = $('#imp'); if (imp) imp.onchange = () => imp.files[0] && importJson(imp.files[0]);
  tickTimer();
}
function updHint(i) {
  const el = $('#hint-' + i); if (!el) return;
  const e = PLAN[draft.session].ex[i], r = hintFor(e, draft.ex[i]);
  el.className = 'hint ' + (r ? r.c : ''); el.textContent = r ? r.t : '';
}
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'dDate') { if (t.value) { draft.date = t.value; saveDraft(); } return; }
  if (t.id === 'dNote') { draft.note = t.value; saveDraft(); return; }
  if (t.id === 'goal') { const v = parseInt(t.value, 10); if (v > 0) { db.waterGoal = v; saveDb(); } return; }
  if (!draft || t.dataset.i == null) return;
  const i = +t.dataset.i, x = draft.ex[i], k = t.dataset.k;
  if (k === 'w') x.w = t.value.replace(',', '.');
  else if (k === 'r') x.reps[+t.dataset.s] = t.value.replace(/[^0-9]/g, '');
  else if (k === 'note') x.note = t.value;
  saveDraft(); updHint(i);
  const sv = $('#saved'); if (sv) { sv.textContent = '✓ Zapisano ' + new Date().toLocaleTimeString('pl-PL', {hour: '2-digit', minute: '2-digit', second: '2-digit'}); }
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  switch (a) {
    case 'tab': tab = v; render(); window.scrollTo(0, 0); break;
    case 'mode': mode = v; localStorage.setItem(MODE_KEY, v); render(); break;
    case 'dmode': draft.mode = v; saveDraft(); render(); break;
    case 'start': startWorkout(v); window.scrollTo(0, 0); break;
    case 'drop': dropDraft(); break;
    case 'finish': finishWorkout(); break;
    case 'tip': { const el = $('#tip-' + b.dataset.i); el.classList.toggle('hidden'); break; }
    case 'timer': startTimer(+v); break;
    case 'tadd': if (timer) { timer.end += 30000; tickTimer(); } break;
    case 'tstop': stopTimer(); break;
    case 'open': $('#h-' + v).classList.toggle('hidden'); break;
    case 'edit': { const w = db.workouts.find(w => w.id === v); if (w) { draft = JSON.parse(JSON.stringify(w)); draft.done = true; saveDraft(); tab = 'train'; render(); window.scrollTo(0, 0); } break; }
    case 'del': if (confirm('Usunąć ten trening?')) { db.workouts = db.workouts.filter(w => w.id !== v); saveDb(); render(); } break;
    case 'water': { const t = todayStr(); db.water[t] = Math.max(0, (db.water[t] || 0) + (+v)); saveDb(); render(); break; }
    case 'bw': { const val = ($('#bw').value || '').replace(',', '.'); if (val && !isNaN(+val)) { db.weights[todayStr()] = val; saveDb(); toast('Zapisano wagę'); render(); } break; }
    case 'exj': exportJson(); break;
    case 'exc': exportCsv(); break;
  }
});
/* ====== START ====== */
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(r => { persisted = r; if (tab === 'bak') render(); }).catch(() => { persisted = false; });
else persisted = false;
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
